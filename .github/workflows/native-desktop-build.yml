name: Native desktop build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "CMakeLists.txt"
      - "desktop/**"
      - "prototype/**"
      - "src/**"
      - "tests/desktop/**"
      - "tests/security/**"
      - "packaging/**"
      - "VERSION"
      - ".github/workflows/native-desktop-build.yml"
  workflow_dispatch:
    inputs:
      cef_version:
        description: "Official CEF standard distribution version"
        required: true
        default: "154.0.34+g14c5a08+chromium-154.0.8037.98"
        type: string
      windows_arch:
        description: "Windows target architecture"
        required: true
        default: "x64"
        type: choice
        options:
          - x64
          - x86
          - arm64
      macos_arch:
        description: "macOS target architecture"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - arm64
          - x86_64

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} with bundled Chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential libasound2-dev libasound2t64 \
            libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libdrm2 libgbm1 libgtk-3-0t64 libgtk-3-dev \
            libnss3 libnss3-dev libpango-1.0-0 libx11-dev libx11-xcb1 \
            libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 \
            libxrandr2 libxshmfence1 xvfb xauth

      - name: Configure the full CEF runtime
        shell: bash
        env:
          CEF_VERSION: ${{ inputs.cef_version || '154.0.34+g14c5a08+chromium-154.0.8037.98' }}
          WINDOWS_ARCH: ${{ inputs.windows_arch || 'x64' }}
          MACOS_ARCH: ${{ inputs.macos_arch || 'auto' }}
        run: |
          APP_VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not a plain semantic version: $APP_VERSION" >&2
            exit 2
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$APP_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($APP_VERSION)." >&2
            exit 2
          fi
          echo "WEBEDYTS_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          cmake_args=(-S . -B build-desktop)

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            case "$WINDOWS_ARCH" in
              x64) cmake_args+=(-A x64) ;;
              x86) cmake_args+=(-A Win32) ;;
              arm64) cmake_args+=(-A ARM64) ;;
              *) echo "Unsupported Windows architecture: $WINDOWS_ARCH" >&2; exit 2 ;;
            esac
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake_args+=(-G Xcode "-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0")
            if [[ "$MACOS_ARCH" != "auto" ]]; then
              cmake_args+=("-DPROJECT_ARCH=$MACOS_ARCH")
            fi
          fi

          cmake_args+=(
            -DWEBEDYTS_BUILD_DESKTOP=ON
            -DWEBEDYTS_DOWNLOAD_CEF=ON
            "-DWEBEDYTS_CEF_VERSION=$CEF_VERSION"
            -DCMAKE_BUILD_TYPE=Release
          )
          cmake "${cmake_args[@]}"

      - name: Build desktop application
        run: cmake --build build-desktop --config Release --parallel 2

      # Includes a real launch of the bundled Chromium-based editor.
      - name: Prepare Linux Chromium sandbox for startup test
        if: runner.os == 'Linux'
        run: |
          sandbox="build-desktop/desktop/Release/chrome-sandbox"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"

      - name: Run tests with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build-desktop -C Release --output-on-failure

      - name: Reset Linux sandbox permissions before packaging
        if: always() && runner.os == 'Linux'
        run: |
          sandbox="build-desktop/desktop/Release/chrome-sandbox"
          if [[ -f "$sandbox" ]]; then
            sudo chown "$(id -u):$(id -g)" "$sandbox"
            sudo chmod 0755 "$sandbox"
          fi

      - name: Run tests
        if: runner.os != 'Linux'
        run: ctest --test-dir build-desktop -C Release --output-on-failure

      - name: Package the complete runtime
        run: cmake --build build-desktop --config Release --target webedyts_package

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_ARCH: ${{ inputs.windows_arch || 'x64' }}
        run: |
          choco install innosetup --yes --no-progress
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $compiler = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup 6 was not found after installation."
          }
          $stageDir = Join-Path $env:GITHUB_WORKSPACE "build-desktop\desktop\Release"
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "build-desktop\packages"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $compiler "packaging\windows\WEBEDYTS.iss" "/DAppVersion=$env:WEBEDYTS_VERSION" "/DAppArch=$env:WINDOWS_ARCH" "/DStageDir=$stageDir" "/DOutputDir=$outputDir"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
          $installer = Join-Path $outputDir "WEBEDYTS-Setup-$($env:WINDOWS_ARCH)-v$($env:WEBEDYTS_VERSION).exe"
          if (-not (Test-Path $installer)) {
            throw "The expected Windows installer was not created: $installer"
          }
          python desktop/tools/write-package-checksum.py $installer
          Get-FileHash -Algorithm SHA256 $installer

      - name: Build Debian / Ubuntu installer
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/build-deb.sh build-desktop/desktop/Release build-desktop/packages "$WEBEDYTS_VERSION" "$(dpkg --print-architecture)"

      - name: Build macOS drag-install disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_ARCH: ${{ inputs.macos_arch || 'auto' }}
        run: |
          architecture="$MACOS_ARCH"
          if [ "$architecture" = "auto" ]; then architecture="$(uname -m)"; fi
          bash packaging/macos/build-dmg.sh "build-desktop/desktop/Release/WEBEDYTS.app" build-desktop/packages "$WEBEDYTS_VERSION" "$architecture"

      - name: Upload installer and runtime package for inspection
        uses: actions/upload-artifact@v7
        with:
          name: WEBEDYTS-${{ matrix.artifact }}-${{ inputs.cef_version || '154.0.34+g14c5a08+chromium-154.0.8037.98' }}
          path: build-desktop/packages/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Assemble a draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged release notes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download installers and portable packages
        uses: actions/download-artifact@v8
        with:
          pattern: WEBEDYTS-*
          path: release-assets
          merge-multiple: true

      - name: Verify every release checksum
        shell: bash
        run: |
          cd release-assets
          shopt -s nullglob
          checksums=( *.sha256 )
          if [[ "${#checksums[@]}" -eq 0 ]]; then echo "No SHA-256 sidecars were produced." >&2; exit 2; fi
          for checksum in "${checksums[@]}"; do sha256sum --check "$checksum"; done

      - name: Create a draft early-access release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          APP_VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$APP_VERSION" ]]; then echo "The release tag no longer matches VERSION." >&2; exit 2; fi
          sed "s/@VERSION@/$APP_VERSION/g" docs/release-notes-template.md > release-notes.md
          shopt -s nullglob
          assets=( release-assets/* )
          if [[ "${#assets[@]}" -lt 6 ]]; then echo "Expected installer, portable package, and checksum files for all platforms." >&2; printf 'Found: %s\n' "${assets[*]}" >&2; exit 2; fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --draft --prerelease --title "WEBEDYTS $GITHUB_REF_NAME — Early Access" --notes-file release-notes.md
