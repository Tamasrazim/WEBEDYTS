name: Native desktop build

on:
  workflow_dispatch:
    inputs:
      cef_version:
        description: "Official CEF standard distribution version"
        required: true
        default: "154.0.34+g14c5a08+chromium-154.0.8037.98"
        type: string
      windows_arch:
        description: "Windows target architecture"
        required: true
        default: "x64"
        type: choice
        options:
          - x64
          - x86
          - arm64
      macos_arch:
        description: "macOS target architecture"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - arm64
          - x86_64

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} with bundled Chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux
          - os: windows-2022
            artifact: windows
          - os: macos-15
            artifact: macos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential libasound2-dev libasound2t64 \
            libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libdrm2 libgbm1 libgtk-3-0t64 libgtk-3-dev \
            libnss3 libnss3-dev libpango-1.0-0 libx11-dev libx11-xcb1 \
            libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 \
            libxrandr2 libxshmfence1 xvfb xauth

      - name: Configure the full CEF runtime
        shell: bash
        env:
          CEF_VERSION: ${{ inputs.cef_version || '154.0.34+g14c5a08+chromium-154.0.8037.98' }}
          WINDOWS_ARCH: ${{ inputs.windows_arch || 'x64' }}
          MACOS_ARCH: ${{ inputs.macos_arch || 'auto' }}
        run: |
          cmake_args=(-S . -B build-desktop)

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            case "$WINDOWS_ARCH" in
              x64) cmake_args+=(-A x64) ;;
              x86) cmake_args+=(-A Win32) ;;
              arm64) cmake_args+=(-A ARM64) ;;
              *) echo "Unsupported Windows architecture: $WINDOWS_ARCH" >&2; exit 2 ;;
            esac
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake_args+=(-G Xcode "-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0")
            if [[ "$MACOS_ARCH" != "auto" ]]; then
              cmake_args+=("-DPROJECT_ARCH=$MACOS_ARCH")
            fi
          fi

          cmake_args+=(
            -DWEBEDYTS_BUILD_DESKTOP=ON
            -DWEBEDYTS_DOWNLOAD_CEF=ON
            "-DWEBEDYTS_CEF_VERSION=$CEF_VERSION"
            -DCMAKE_BUILD_TYPE=Release
          )
          cmake "${cmake_args[@]}"

      - name: Build desktop application
        run: cmake --build build-desktop --config Release --parallel 2

      # Includes a real launch of the bundled Chromium-based editor.
      - name: Run tests with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build-desktop -C Release --output-on-failure

      - name: Run tests
        if: runner.os != 'Linux'
        run: ctest --test-dir build-desktop -C Release --output-on-failure

      - name: Package the complete runtime
        run: cmake --build build-desktop --config Release --target webedyts_package

      - name: Upload portable package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: WEBEDYTS-${{ matrix.artifact }}-${{ inputs.cef_version || '154.0.34+g14c5a08+chromium-154.0.8037.98' }}
          path: build-desktop/packages/*
          if-no-files-found: error
          retention-days: 14
